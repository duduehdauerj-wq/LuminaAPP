<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lumina" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="https://api.iconify.design/lucide:sparkles.svg?color=%234f46e5" />
    
    <title>Lumina</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              glass: {
                100: 'rgba(255, 255, 255, 0.1)',
                200: 'rgba(255, 255, 255, 0.2)',
                300: 'rgba(255, 255, 255, 0.3)',
                dark: 'rgba(0, 0, 0, 0.6)',
              }
            },
            animation: {
              'box-breathe': 'breathe 16s infinite ease-in-out',
              'fade-in': 'fadeIn 0.5s ease-out forwards',
              'slide-up': 'slideUp 0.4s ease-out forwards',
            },
            keyframes: {
              breathe: {
                '0%': { transform: 'scale(1)', opacity: '0.3' },              // Start Inhale
                '25%': { transform: 'scale(1.8)', opacity: '1' },             // End Inhale (4s)
                '50%': { transform: 'scale(1.8)', opacity: '1' },             // End Hold (4s)
                '75%': { transform: 'scale(1)', opacity: '0.3' },             // End Exhale (4s)
                '100%': { transform: 'scale(1)', opacity: '0.3' },            // End Hold (4s)
              },
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              slideUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background: linear-gradient(135deg, #e0e7ff 0%, #f3f4f6 100%);
        min-height: 100vh;
        padding-bottom: env(safe-area-inset-bottom);
        -webkit-tap-highlight-color: transparent;
      }
      .dark body {
        background: #050505; /* Deep Black */
      }
      
      /* Mobile-friendly scrollbar */
      ::-webkit-scrollbar {
        width: 0px;
        background: transparent; /* Optional: just hide scrollbar for cleaner mobile look */
      }

      /* Liquid Glass Utilities - Enhanced */
      .liquid-glass {
        /* Lighter, more opaque glass for Light Mode */
        background: linear-gradient(145deg, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.75));
        backdrop-filter: blur(30px);
        -webkit-backdrop-filter: blur(30px);
        border: 1px solid rgba(255, 255, 255, 0.8);
        box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.1), 
                    inset 0 0 0 1px rgba(255, 255, 255, 0.5);
      }
      
      .dark .liquid-glass {
        /* Darker, deeper glass for Dark Mode */
        background: linear-gradient(145deg, rgba(30, 30, 30, 0.85), rgba(15, 15, 15, 0.95));
        backdrop-filter: blur(40px);
        -webkit-backdrop-filter: blur(40px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.5),
                    inset 0 1px 0 0 rgba(255, 255, 255, 0.1);
      }

      /* Utilities */
      .custom-scrollbar::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(156, 163, 175, 0.5);
        border-radius: 10px;
      }
      .no-scrollbar-mobile::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar-mobile {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "recharts": "https://aistudiocdn.com/recharts@^3.4.1",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "react-dom/client": "https://aistudiocdn.com/react-dom@^19.2.0/client",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "jspdf": "https://aistudiocdn.com/jspdf@^3.0.4",
    "date-fns": "https://aistudiocdn.com/date-fns@^2.30.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "date-fns/": "https://aistudiocdn.com/date-fns@^4.1.0/"
  }
}
</script>
</head>
  <body>
    <noscript>Você precisa habilitar o JavaScript para usar o Lumina.</noscript>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
